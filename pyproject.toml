[project]
name = "pocketvault"
version = "0.1.0"
description = "Unified personal finance TUI — Crew budgeting, retirement, Monster P&L"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "robin_stocks>=3.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
pocketvault = "pocketvault.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
